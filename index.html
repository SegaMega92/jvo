<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Primary -->
    <title>JVO — платформа аналитики и автоматизации для маркетплейсов</title>
    <meta name="description" content="JVO — AI-платформа для управления продажами на Wildberries и Ozon. Автоматизация цен, аналитика, SEO карточек, управление логистикой. Рост продаж до 30%." />
    <meta name="keywords" content="JVO, маркетплейсы, Wildberries, Ozon, аналитика продаж, автоматизация, AI менеджер, управление ценами, SEO карточек, e-commerce" />
    <meta name="author" content="JVO" />
    <link rel="canonical" href="https://jvo.ru/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JVO" />
    <meta property="og:title" content="JVO — платформа аналитики и автоматизации для маркетплейсов" />
    <meta property="og:description" content="AI-платформа для управления продажами на Wildberries и Ozon. Автоматизация цен, аналитика, SEO карточек, логистика." />
    <meta property="og:url" content="https://jvo.ru/" />
    <meta property="og:image" content="https://jvo.ru/images/JVO-logo-black.png" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JVO — платформа аналитики и автоматизации для маркетплейсов" />
    <meta name="twitter:description" content="AI-платформа для управления продажами на Wildberries и Ozon. Рост продаж до 30%." />
    <meta name="twitter:image" content="https://jvo.ru/images/JVO-logo-black.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "JVO",
      "url": "https://jvo.ru",
      "logo": "https://jvo.ru/images/JVO-logo-black.png",
      "description": "Платформа аналитики и автоматизации для маркетплейсов Wildberries и Ozon",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+7-499-322-09-33",
        "email": "hi@jvo.ru",
        "contactType": "customer service",
        "availableLanguage": "Russian"
      },
      "sameAs": [
        "https://t.me/jvo_ru",
        "https://vk.com/jvo_ru"
      ]
    }
    </script>

    <!-- JSON-LD: WebSite (for search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "JVO",
      "url": "https://jvo.ru",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://jvo.ru/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "JVO",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "AI-платформа для автоматизации продаж на маркетплейсах",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "RUB",
        "description": "Бесплатный пробный период"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "500"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
